<!DOCTYPE html>

<head>

    <style>
        /* Lock page to exact screen resolution on any monitor or phone */
        html, body {
            font-family: 'Inter', sans-serif;
            background-color: #FDFBF7;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }
        
        .font-serif {
            font-family: 'Playfair Display', serif;
        }

        /* Video mirroring for a natural selfie experience */
        #camera-stream {
            transform: scaleX(-1);
            transition: filter 0.3s ease;
        }
        
        /* 4x6 Photo Paper container styling for display */
        .photo-paper-display {
            background: #FFFFFF;
            padding: 8px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15), 0 10px 10px -5px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(74, 4, 4, 0.2);
        }

        /* Countdown Animation */
        @keyframes pop {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 0; }
        }
        .animate-pop {
            animation: pop 1s ease-in-out;
        }

        /* Flash Animation */
        .flash-active {
            opacity: 1 !important;
            transition: opacity 0.1s ease-out;
        }
        .flash-fade {
            opacity: 0 !important;
            transition: opacity 0.8s ease-in;
        }
    </style>
</head>

                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>

    <!-- Load MediaPipe Vision Tasks for Real-Time Face Detection (Runs silently in background) -->
    <script type="module">
        import { FaceDetector, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

        async function setupFaceDetector() {
            try {
                const vision = await FilesetResolver.forVisionTasks(
                    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
                );
                window.faceDetector = await FaceDetector.createFromOptions(vision, {
                    baseOptions: {
                        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite",
                        delegate: "GPU"
                    },
                    runningMode: "VIDEO",
                    minDetectionConfidence: 0.5
                });
            } catch (err) {
                console.warn("MediaPipe GPU fallback to CPU or unavailable:", err);
            }
        }

        setupFaceDetector();
    </script>

    <script>
        const video = document.getElementById('camera-stream');
        const tempCanvas = document.getElementById('temp-canvas');
        const singleStripCanvas = document.getElementById('single-strip-canvas');
        const paperCanvas = document.getElementById('paper-canvas');
        const liveStickerCanvas = document.getElementById('live-sticker-canvas');
        const reviewStickerCanvas = document.getElementById('review-sticker-canvas');
        const liveVintageTint = document.getElementById('live-vintage-tint');
        const reviewVintageTint = document.getElementById('review-vintage-tint');
        const paperResult = document.getElementById('paper-result');
        const startBtn = document.getElementById('start-btn');
        const statusText = document.getElementById('status-text');
        const errorOverlay = document.getElementById('error-overlay');
        const countdownOverlay = document.getElementById('countdown-overlay');
        const countdownText = document.getElementById('countdown-text');
        const flashOverlay = document.getElementById('flash-overlay');
        const progressIndicator = document.getElementById('progress-indicator');
        const resultContainer = document.getElementById('result-container');
        const reviewOverlay = document.getElementById('review-overlay');
        const reviewImage = document.getElementById('review-image');
        const btnKeep = document.getElementById('btn-keep');
        const sheetCounterBadge = document.getElementById('sheet-counter-badge');
        const downloadSingleBtn = document.getElementById('download-single-btn');
        
        let stream = null;
        let capturedFrames = [];
        let completedStrips = []; // Holds up to 4 dataURLs of 2"x3" strips to fill one 4"x6" photo paper
        
        // Real-Time Face Tracking State
        let liveFaces = [];           // Current frame's detected face anchors (smoothed)
        let capturedFaceAnchors = []; // Frozen face anchors at the exact moment a photo is snapped
        let lastVideoTime = -1;

        const PHOTOS_PER_STRIP = 2; // 2 photos per strip
        const STRIPS_PER_PAPER = 4; // 4 strips (2x3) fill one 4x6 photo paper
        
        let currentFilter = 'normal';
        let currentSticker = 'none';
        let countdownTime = 3;
        let reviewResolve = null;

        const filterMap = {
            'normal': 'none',
            'bw': 'grayscale(100%) contrast(108%)',
            'vintage': 'sepia(48%) saturate(72%) contrast(114%) brightness(95%) hue-rotate(-8deg)',
            'y2k': 'contrast(125%) saturate(145%) brightness(108%)'
        };

        // ============================================================================
        // EXACT PRINT DIMENSIONS AT 300 DPI (Dots Per Inch)
        // ============================================================================
        const DPI = 300;
        const PIC_WIDTH = Math.round(1.8 * DPI);    // 540px (1.8 inches)
        const PIC_HEIGHT = Math.round(1.2 * DPI);   // 360px (1.2 inches)
        const STRIP_WIDTH = Math.round(2.0 * DPI);  // 600px (2.0 inches)
        const STRIP_HEIGHT = Math.round(3.0 * DPI); // 900px (3.0 inches)
        const PAPER_WIDTH = Math.round(4.0 * DPI);  // 1200px (4.0 inches)
        const PAPER_HEIGHT = Math.round(6.0 * DPI); // 1800px (6.0 inches)

        const STRIP_BG_COLOR = '#4A0404';
        const SIDE_MARGIN = Math.round((STRIP_WIDTH - PIC_WIDTH) / 2); // 30px
        const TOP_MARGIN = 26;
        const PHOTO_GAP = 26;

        const EVENT_NAME = "NCC INTEGRATIONAL ACTIVITY";
        const EVENT_DATE = "2026";

        // ============================================================================
        // REAL-TIME FACE TRACKING LOOP (60 FPS)
        // ============================================================================
        function trackFacesLoop() {
            if (video.readyState >= 2 && !video.paused) {
                if (window.faceDetector && video.currentTime !== lastVideoTime) {
                    lastVideoTime = video.currentTime;
                    try {
                        const result = window.faceDetector.detectForVideo(video, performance.now());
                        updateLiveFaceAnchors(result.detections || []);
                    } catch (e) {
                        // Ignore transient frame errors
                    }
                }
                // Redraw live sticker canvas at 60fps following the user's face
                liveStickerCanvas.width = PIC_WIDTH;
                liveStickerCanvas.height = PIC_HEIGHT;
                const liveCtx = liveStickerCanvas.getContext('2d');
                liveCtx.clearRect(0, 0, PIC_WIDTH, PIC_HEIGHT);
                drawStickerLayer(liveCtx, PIC_WIDTH, PIC_HEIGHT, currentSticker, liveFaces);
            }
            requestAnimationFrame(trackFacesLoop);
        }

        // Converts raw video coordinates into mirrored 3:2 cropped canvas coordinates (540x360)
        function updateLiveFaceAnchors(detections) {
            const vWidth = video.videoWidth;
            const vHeight = video.videoHeight;
            if (!vWidth || !vHeight) return;

            const sRatio = vWidth / vHeight;
            const dRatio = PIC_WIDTH / PIC_HEIGHT; // 1.5 (3:2)
            let sx = 0, sy = 0, sw = vWidth, sh = vHeight;

            if (sRatio > dRatio) {
                sw = vHeight * dRatio;
                sx = (vWidth - sw) / 2;
            } else {
                sh = vWidth / dRatio;
                sy = (vHeight - sh) / 2;
            }

            const toCanvasPt = (normX, normY) => {
                const rawPx = normX * vWidth;
                const rawPy = normY * vHeight;
                const croppedX = ((rawPx - sx) / sw) * PIC_WIDTH;
                const croppedY = ((rawPy - sy) / sh) * PIC_HEIGHT;
                return { x: PIC_WIDTH - croppedX, y: croppedY };
            };

            const newFaces = detections.slice(0, 4).map(det => {
                const kp = det.keypoints;
                const eyeA = toCanvasPt(kp[0].x, kp[0].y);
                const eyeB = toCanvasPt(kp[1].x, kp[1].y);

                const leftEye = eyeA.x < eyeB.x ? eyeA : eyeB;
                const rightEye = eyeA.x < eyeB.x ? eyeB : eyeA;

                const eyeCenterX = (leftEye.x + rightEye.x) / 2;
                const eyeCenterY = (leftEye.y + rightEye.y) / 2;
                const dx = rightEye.x - leftEye.x;
                const dy = rightEye.y - leftEye.y;
                const eyeDist = Math.hypot(dx, dy);
                const angle = Math.atan2(dy, dx);

                return {
                    eyeCenterX,
                    eyeCenterY,
                    leftEye,
                    rightEye,
                    eyeDist,
                    angle
                };
            });

            if (newFaces.length === 0) {
                liveFaces = [];
            } else if (liveFaces.length !== newFaces.length) {
                liveFaces = newFaces;
            } else {
                const smooth = 0.45;
                liveFaces = newFaces.map((nf, idx) => {
                    const pf = liveFaces[idx];
                    return {
                        eyeCenterX: pf.eyeCenterX + (nf.eyeCenterX - pf.eyeCenterX) * smooth,
                        eyeCenterY: pf.eyeCenterY + (nf.eyeCenterY - pf.eyeCenterY) * smooth,
                        leftEye: {
                            x: pf.leftEye.x + (nf.leftEye.x - pf.leftEye.x) * smooth,
                            y: pf.leftEye.y + (nf.leftEye.y - pf.leftEye.y) * smooth
                        },
                        rightEye: {
                            x: pf.rightEye.x + (nf.rightEye.x - pf.rightEye.x) * smooth,
                            y: pf.rightEye.y + (nf.rightEye.y - pf.rightEye.y) * smooth
                        },
                        eyeDist: pf.eyeDist + (nf.eyeDist - pf.eyeDist) * smooth,
                        angle: pf.angle + (nf.angle - pf.angle) * smooth
                    };
                });
            }
        }

        function getFallbackFaceAnchor(w, h) {
            return [{
                eyeCenterX: w * 0.5,
                eyeCenterY: h * 0.44,
                leftEye: { x: w * 0.41, y: h * 0.44 },
                rightEye: { x: w * 0.59, y: h * 0.44 },
                eyeDist: w * 0.18,
                angle: 0
            }];
        }

        // ============================================================================
        // FILTER & STICKER CONTROLS
        // ============================================================================
        function setFilter(filter) {
            currentFilter = filter;
            video.style.filter = filterMap[filter];

            if (filter === 'vintage') {
                liveVintageTint.classList.remove('hidden');
                reviewVintageTint.classList.remove('hidden');
            } else {
                liveVintageTint.classList.add('hidden');
                reviewVintageTint.classList.add('hidden');
            }

            const filters = ['normal', 'bw', 'vintage', 'y2k'];
            filters.forEach(f => {
                const el = document.getElementById(`btn-filter-${f}`);
                if (f === filter) {
                    el.classList.add('bg-[#4A0404]', 'text-[#FDFBF7]', 'shadow-md', 'border-transparent');
                    el.classList.remove('text-gray-500', 'bg-white', 'hover:text-[#4A0404]', 'border-gray-200');
                } else {
                    el.classList.remove('bg-[#4A0404]', 'text-[#FDFBF7]', 'shadow-md', 'border-transparent');
                    el.classList.add('text-gray-500', 'bg-white', 'hover:text-[#4A0404]', 'border-gray-200');
                }
            });

            if (!reviewOverlay.classList.contains('hidden')) {
                reviewImage.style.filter = filterMap[filter];
            }
        }

        function setSticker(sticker) {
            currentSticker = sticker;

            const stickers = ['none', 'hearts', 'sparkles', 'blush', 'bows', 'datestamp'];
            stickers.forEach(s => {
                const el = document.getElementById(`btn-sticker-${s}`);
                if (s === sticker) {
                    el.classList.add('bg-[#4A0404]', 'text-[#FDFBF7]', 'shadow-md', 'border-transparent');
                    el.classList.remove('text-gray-500', 'bg-white', 'hover:text-[#4A0404]', 'border-gray-200');
                } else {
                    el.classList.remove('bg-[#4A0404]', 'text-[#FDFBF7]', 'shadow-md', 'border-transparent');
                    el.classList.add('text-gray-500', 'bg-white', 'hover:text-[#4A0404]', 'border-gray-200');
                }
            });

            updateReviewStickerPreview();
        }

        function updateReviewStickerPreview() {
            reviewStickerCanvas.width = PIC_WIDTH;
            reviewStickerCanvas.height = PIC_HEIGHT;
            const revCtx = reviewStickerCanvas.getContext('2d');
            revCtx.clearRect(0, 0, PIC_WIDTH, PIC_HEIGHT);
            drawStickerLayer(revCtx, PIC_WIDTH, PIC_HEIGHT, currentSticker, capturedFaceAnchors);
        }

        // ============================================================================
        // FACE-TRACKED STICKER DRAWING ENGINE
        // ============================================================================
        function drawStickerLayer(ctx, w, h, stickerType, faceList) {
            if (stickerType === 'none') return;

            if (stickerType === 'datestamp') {
                ctx.save();
                const fontSize = Math.round((w / 540) * 22);
                ctx.font = `700 ${fontSize}px "Courier New", monospace`;
                ctx.fillStyle = '#FF7A00';
                ctx.shadowColor = '#FF3300';
                ctx.shadowBlur = 8;
                ctx.textAlign = 'right';
                ctx.fillText("'26 11 02", w * 0.93, h * 0.91);
                ctx.restore();
                return;
            }

            const facesToRender = (faceList && faceList.length > 0) ? faceList : getFallbackFaceAnchor(w, h);

            facesToRender.forEach(face => {
                ctx.save();
                ctx.translate(face.eyeCenterX, face.eyeCenterY);
                ctx.rotate(face.angle);

                const scale = Math.max(0.55, Math.min(2.2, face.eyeDist / 95));

                if (stickerType === 'hearts') {
                    const crownHearts = [
                        { ox: -135, oy: -75,  size: 22, rot: -0.35, color: '#FF5C9E', alpha: 0.88 },
                        { ox: -112, oy: -112, size: 28, rot: -0.25, color: '#FF85B8', alpha: 0.82 },
                        { ox: -75,  oy: -98,  size: 20, rot: -0.15, color: '#FF3385', alpha: 0.92 },
                        { ox: -38,  oy: -132, size: 25, rot: -0.08, color: '#FF4D94', alpha: 0.90 },
                        { ox: 6,    oy: -138, size: 34, rot: 0.05,  color: '#E62E7A', alpha: 0.94 },
                        { ox: -6,   oy: -120, size: 22, rot: -0.10, color: '#FF70A6', alpha: 0.88 },
                        { ox: 62,   oy: -116, size: 32, rot: 0.18,  color: '#FF4791', alpha: 0.92 },
                        { ox: 88,   oy: -85,  size: 17, rot: 0.22,  color: '#FF70A6', alpha: 0.90 },
                        { ox: 126,  oy: -88,  size: 22, rot: 0.32,  color: '#FF3385', alpha: 0.86 }
                    ];

                    crownHearts.forEach(hItem => {
                        drawSoftHeart(
                            ctx,
                            hItem.ox * scale,
                            hItem.oy * scale,
                            hItem.size * scale,
                            hItem.rot,
                            hItem.color,
                            hItem.alpha
                        );
                    });
                } else if (stickerType === 'blush') {
                    drawCheekBlush(ctx, -56 * scale, 36 * scale, 32 * scale);
                    drawCheekBlush(ctx, 56 * scale,  36 * scale, 32 * scale);
                    drawSoftHeart(ctx, -110 * scale, 10 * scale, 17 * scale, -0.25, '#FF5C9E', 0.88);
                    drawSoftHeart(ctx, 110 * scale,  10 * scale, 17 * scale, 0.25,  '#FF5C9E', 0.88);
                } else if (stickerType === 'bows') {
                    drawRibbonBow(ctx, -125 * scale, -95 * scale, 30 * scale, -0.20);
                    drawRibbonBow(ctx, 125 * scale,  -95 * scale, 30 * scale, 0.20);
                    drawSoftHeart(ctx, 0, -135 * scale, 18 * scale, 0, '#FF70A6', 0.88);
                } else if (stickerType === 'sparkles') {
                    const haloSparkles = [
                        { ox: -145, oy: -90,  size: 24, color: '#FFF9D2' },
                        { ox: -105, oy: -145, size: 15, color: '#FFFFFF' },
                        { ox: 145,  oy: -95,  size: 26, color: '#FFF9D2' },
                        { ox: 110,  oy: -140, size: 15, color: '#FFFFFF' },
                        { ox: -155, oy: 30,   size: 20, color: '#FFFFFF' },
                        { ox: 155,  oy: 35,   size: 22, color: '#FFF9D2' },
                        { ox: 0,    oy: -160, size: 18, color: '#FFD6E8' }
                    ];
                    haloSparkles.forEach(sp => {
                        drawFourPointStar(ctx, sp.ox * scale, sp.oy * scale, sp.size * scale, sp.color);
                    });
                }

                ctx.restore();
            });
        }

        function drawSoftHeart(ctx, cx, cy, size, angle, color, alpha) {
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(angle);
            ctx.globalAlpha = alpha;
            ctx.fillStyle = color;
            ctx.shadowColor = color;
            ctx.shadowBlur = size * 0.35;

            ctx.beginPath();
            const topCurveHeight = size * 0.3;
            ctx.moveTo(0, topCurveHeight);
            ctx.bezierCurveTo(0, 0, -size / 2, 0, -size / 2, topCurveHeight);
            ctx.bezierCurveTo(-size / 2, (size + topCurveHeight) / 2, 0, (size + topCurveHeight) / 1.45, 0, size);
            ctx.bezierCurveTo(0, (size + topCurveHeight) / 1.45, size / 2, (size + topCurveHeight) / 2, size / 2, topCurveHeight);
            ctx.bezierCurveTo(size / 2, 0, 0, 0, 0, topCurveHeight);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        function drawFourPointStar(ctx, cx, cy, size, color) {
            ctx.save();
            ctx.translate(cx, cy);
            ctx.fillStyle = color;
            ctx.shadowColor = '#FFFFFF';
            ctx.shadowBlur = 10;

            ctx.beginPath();
            ctx.moveTo(0, -size);
            ctx.quadraticCurveTo(0, 0, size, 0);
            ctx.quadraticCurveTo(0, 0, 0, size);
            ctx.quadraticCurveTo(0, 0, -size, 0);
            ctx.quadraticCurveTo(0, 0, 0, -size);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        function drawCheekBlush(ctx, cx, cy, radius) {
            ctx.save();
            const grad = ctx.createRadialGradient(cx, cy, radius * 0.1, cx, cy, radius);
            grad.addColorStop(0, 'rgba(255, 90, 145, 0.58)');
            grad.addColorStop(1, 'rgba(255, 90, 145, 0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = 'rgba(255, 75, 130, 0.55)';
            ctx.lineWidth = Math.max(1.5, radius * 0.06);
            ctx.lineCap = 'round';
            const step = radius * 0.24;
            for (let i = -1; i <= 1; i++) {
                ctx.beginPath();
                ctx.moveTo(cx + i * step - 3, cy + 4);
                ctx.lineTo(cx + i * step + 3, cy - 4);
                ctx.stroke();
            }
            ctx.restore();
        }

        function drawRibbonBow(ctx, cx, cy, size, angle) {
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(angle);
            ctx.fillStyle = '#FF85B8';
            ctx.strokeStyle = '#E62E7A';
            ctx.lineWidth = Math.max(1.5, size * 0.06);
            ctx.shadowColor = 'rgba(230, 46, 122, 0.3)';
            ctx.shadowBlur = 6;

            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.bezierCurveTo(-size, -size * 0.7, -size, size * 0.7, 0, 0);
            ctx.fill();
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.bezierCurveTo(size, -size * 0.7, size, size * 0.7, 0, 0);
            ctx.fill();
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(-3, 2);
            ctx.quadraticCurveTo(-size * 0.4, size * 0.8, -size * 0.6, size * 0.9);
            ctx.lineTo(-size * 0.3, size * 0.95);
            ctx.quadraticCurveTo(-size * 0.2, size * 0.6, 0, 4);
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(3, 2);
            ctx.quadraticCurveTo(size * 0.4, size * 0.8, size * 0.6, size * 0.9);
            ctx.lineTo(size * 0.3, size * 0.95);
            ctx.quadraticCurveTo(size * 0.2, size * 0.6, 0, 4);
            ctx.fill();

            ctx.beginPath();
            ctx.arc(0, 0, size * 0.18, 0, Math.PI * 2);
            ctx.fillStyle = '#FF5C9E';
            ctx.fill();
            ctx.stroke();

            ctx.restore();
        }

        function setTimer(seconds) {
            countdownTime = seconds;

            const timers = [3, 5, 10];
            timers.forEach(t => {
                const el = document.getElementById(`btn-timer-${t}`);
                if (t === seconds) {
                    el.classList.add('bg-[#4A0404]', 'text-[#FDFBF7]', 'shadow-sm');
                    el.classList.remove('text-gray-500', 'hover:text-[#4A0404]');
                } else {
                    el.classList.remove('bg-[#4A0404]', 'text-[#FDFBF7]', 'shadow-sm');
                    el.classList.add('text-gray-500', 'hover:text-[#4A0404]');
                }
            });
        }

        async function initCamera() {
            errorOverlay.classList.add('hidden');
            render4x6PaperCanvas();
            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: { ideal: 1440 }, height: { ideal: 960 }, facingMode: "user" }, 
                    audio: false 
                });
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    requestAnimationFrame(trackFacesLoop);
                };
                startBtn.disabled = false;
                statusText.classList.remove('opacity-0');
            } catch (err) {
                console.error("Error accessing webcam:", err);
                errorOverlay.classList.remove('hidden');
                startBtn.disabled = true;
            }
        }

        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        function lockControls(lock) {
            const controls = ['btn-timer-3', 'btn-timer-5', 'btn-timer-10'];
            controls.forEach(id => document.getElementById(id).disabled = lock);
        }

        function openMobileResult() {
            resultContainer.classList.remove('hidden');
        }

        function closeMobileResult() {
            if (window.innerWidth < 768) {
                resultContainer.classList.add('hidden');
            }
        }

        async function startPhotoSequence() {
            if (!stream) return;

            if (completedStrips.length >= STRIPS_PER_PAPER) {
                completedStrips = [];
                await render4x6PaperCanvas();
            }

            const currentStripNumber = completedStrips.length + 1;
            startBtn.disabled = true;
            lockControls(true);
            capturedFrames = [];
            
            closeMobileResult();
            
            progressIndicator.classList.remove('hidden');
            statusText.innerText = `Capturing Strip ${currentStripNumber} of ${STRIPS_PER_PAPER}...`;

            for (let i = 0; i < PHOTOS_PER_STRIP; i++) {
                progressIndicator.innerText = `Photo ${i + 1} / ${PHOTOS_PER_STRIP}`;
                let frameAccepted = false;
                
                while (!frameAccepted) {
                    await runCountdown();
                    triggerFlash();
                    
                    capturedFaceAnchors = JSON.parse(JSON.stringify(liveFaces));
                    const frameDataUrl = captureFrame(); 
                    const action = await showReviewUI(frameDataUrl, i === PHOTOS_PER_STRIP - 1);
                    
                    if (action === 'keep') {
                        const finalFrameUrl = await applyCurrentFilterAndStickerToDataUrl(frameDataUrl, capturedFaceAnchors);
                        capturedFrames.push(finalFrameUrl);
                        frameAccepted = true;
                        
                        if (i < PHOTOS_PER_STRIP - 1) {
                            statusText.innerText = "Next pose in a moment...";
                            await sleep(600);
                        }
                    } else {
                        statusText.innerText = "Retaking photo...";
                        await sleep(500);
                    }
                }
            }

            progressIndicator.classList.add('hidden');
            statusText.innerText = `Adding Strip ${currentStripNumber} to 4×6 paper...`;
            
            const singleStripDataUrl = await generateSingle2x3Strip();
            completedStrips.push(singleStripDataUrl);
            downloadSingleBtn.disabled = false;

            await render4x6PaperCanvas();
            updateUIForNextStrip();

            if (window.innerWidth < 768) {
                openMobileResult();
            }

            startBtn.disabled = false;
            lockControls(false);
        }

        function updateUIForNextStrip() {
            const count = completedStrips.length;
            sheetCounterBadge.innerText = `${count} / ${STRIPS_PER_PAPER} Strips`;

            if (count < STRIPS_PER_PAPER) {
                startBtn.innerText = `Capture Strip ${count + 1} of ${STRIPS_PER_PAPER}`;
                statusText.innerText = `Strip ${count} added! Take ${STRIPS_PER_PAPER - count} more to fill the 4×6 paper.`;
            } else {
                startBtn.innerText = "Start New 4×6 Paper (1 of 4)";
                statusText.innerText = "4×6 Photo Paper is FULL (4/4 Strips)! Ready to download & print.";
            }
        }

        async function resetPaperSheet() {
            completedStrips = [];
            downloadSingleBtn.disabled = true;
            sheetCounterBadge.innerText = `0 / ${STRIPS_PER_PAPER} Strips`;
            startBtn.innerText = `Capture Strip 1 of ${STRIPS_PER_PAPER}`;
            statusText.innerText = "4×6 sheet cleared. Ready for Strip 1...";
            await render4x6PaperCanvas();
        }

        function showReviewUI(dataUrl, isLast) {
            return new Promise((resolve) => {
                reviewImage.src = dataUrl;
                reviewImage.style.filter = filterMap[currentFilter];
                updateReviewStickerPreview();
                reviewOverlay.classList.remove('hidden');
                btnKeep.innerText = isLast ? "Finish Strip" : "Keep & Next Pose";
                reviewResolve = resolve;
            });
        }

        function resolveReview(action) {
            if (reviewResolve) {
                reviewOverlay.classList.add('hidden');
                reviewResolve(action);
                reviewResolve = null;
            }
        }

        function runCountdown() {
            return new Promise((resolve) => {
                countdownOverlay.classList.remove('hidden');
                let count = countdownTime;
                
                const triggerAnimation = () => {
                    countdownText.innerText = count;
                    countdownText.classList.remove('animate-pop');
                    void countdownText.offsetWidth;
                    countdownText.classList.add('animate-pop');
                };

                triggerAnimation();

                const timer = setInterval(() => {
                    count--;
                    if (count > 0) {
                        triggerAnimation();
                    } else {
                        clearInterval(timer);
                        countdownOverlay.classList.add('hidden');
                        resolve();
                    }
                }, 1000);
            });
        }

        function triggerFlash() {
            flashOverlay.classList.remove('flash-fade');
            flashOverlay.classList.add('flash-active');
            
            setTimeout(() => {
                flashOverlay.classList.remove('flash-active');
                flashOverlay.classList.add('flash-fade');
            }, 50);
        }

        function captureFrame() {
            const vWidth = video.videoWidth;
            const vHeight = video.videoHeight;
            tempCanvas.width = PIC_WIDTH;
            tempCanvas.height = PIC_HEIGHT;
            const ctx = tempCanvas.getContext('2d');

            const sRatio = vWidth / vHeight;
            const dRatio = PIC_WIDTH / PIC_HEIGHT;
            let sx = 0, sy = 0, sw = vWidth, sh = vHeight;

            if (sRatio > dRatio) {
                sw = vHeight * dRatio;
                sx = (vWidth - sw) / 2;
            } else {
                sh = vWidth / dRatio;
                sy = (vHeight - sh) / 2;
            }

            ctx.translate(PIC_WIDTH, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(video, sx, sy, sw, sh, 0, 0, PIC_WIDTH, PIC_HEIGHT);
            
            return tempCanvas.toDataURL('image/jpeg', 1.0);
        }

        function applyCurrentFilterAndStickerToDataUrl(dataUrl, faceAnchors) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    const ctx = tempCanvas.getContext('2d');
                    tempCanvas.width = PIC_WIDTH;
                    tempCanvas.height = PIC_HEIGHT;
                    
                    ctx.filter = filterMap[currentFilter];
                    ctx.drawImage(img, 0, 0, PIC_WIDTH, PIC_HEIGHT);
                    ctx.filter = 'none';

                    if (currentFilter === 'vintage') {
                        ctx.save();
                        ctx.globalCompositeOperation = 'multiply';
                        const grad = ctx.createRadialGradient(
                            PIC_WIDTH / 2, PIC_HEIGHT / 2, PIC_WIDTH * 0.18,
                            PIC_WIDTH / 2, PIC_HEIGHT / 2, PIC_WIDTH * 0.75
                        );
                        grad.addColorStop(0, 'rgba(65, 40, 25, 0.08)');
                        grad.addColorStop(1, 'rgba(45, 25, 12, 0.28)');
                        ctx.fillStyle = grad;
                        ctx.fillRect(0, 0, PIC_WIDTH, PIC_HEIGHT);
                        ctx.restore();
                    }

                    drawStickerLayer(ctx, PIC_WIDTH, PIC_HEIGHT, currentSticker, faceAnchors);
                    
                    resolve(tempCanvas.toDataURL('image/jpeg', 0.98));
                };
                img.src = dataUrl;
            });
        }

        // ============================================================================
        // GENERATE SINGLE 2" x 3" STRIP (600px x 900px) WITH 1.8" x 1.2" PHOTOS
        // ============================================================================
        function generateSingle2x3Strip() {
            return new Promise((resolve) => {
                singleStripCanvas.width = STRIP_WIDTH;
                singleStripCanvas.height = STRIP_HEIGHT;
                const ctx = singleStripCanvas.getContext('2d');

                ctx.fillStyle = STRIP_BG_COLOR;
                ctx.fillRect(0, 0, STRIP_WIDTH, STRIP_HEIGHT);

                let loadedImages = 0;
                const images = [];

                capturedFrames.forEach((src, index) => {
                    const img = new Image();
                    img.onload = () => {
                        images[index] = img;
                        loadedImages++;
                        if (loadedImages === PHOTOS_PER_STRIP) {
                            images.forEach((photoImg, i) => {
                                const yPos = TOP_MARGIN + (i * (PIC_HEIGHT + PHOTO_GAP));
                                ctx.drawImage(photoImg, SIDE_MARGIN, yPos, PIC_WIDTH, PIC_HEIGHT);
                            });

                            drawStripFooterText(ctx, STRIP_WIDTH / 2);
                            resolve(singleStripCanvas.toDataURL('image/jpeg', 0.98));
                        }
                    };
                    img.src = src;
                });
            });
        }

        function drawStripFooterText(ctx, centerX) {
            ctx.fillStyle = '#FFFFFF';
            ctx.textAlign = 'center';

            ctx.font = '900 30px "Inter", sans-serif';
            ctx.fillText(EVENT_NAME, centerX, 822);

            ctx.font = 'italic 44px "Playfair Display", serif';
            ctx.fillText(EVENT_DATE, centerX, 870);
        }

        // ============================================================================
        // RENDER 4" x 6" PHOTO PAPER (1200px x 1800px) HOLDING 4 STRIPS (2x2 GRID)
        // ============================================================================
        function render4x6PaperCanvas() {
            return new Promise((resolve) => {
                paperCanvas.width = PAPER_WIDTH;
                paperCanvas.height = PAPER_HEIGHT;
                const ctx = paperCanvas.getContext('2d');

                ctx.fillStyle = '#F3EFEA';
                ctx.fillRect(0, 0, PAPER_WIDTH, PAPER_HEIGHT);

                const slots = [
                    { x: 0,           y: 0,            label: "STRIP 1" },
                    { x: STRIP_WIDTH, y: 0,            label: "STRIP 2" },
                    { x: 0,           y: STRIP_HEIGHT, label: "STRIP 3" },
                    { x: STRIP_WIDTH, y: STRIP_HEIGHT, label: "STRIP 4" }
                ];

                slots.forEach((slot) => {
                    ctx.fillStyle = '#EAE4DC';
                    ctx.fillRect(slot.x, slot.y, STRIP_WIDTH, STRIP_HEIGHT);

                    ctx.fillStyle = '#9CA3AF';
                    ctx.textAlign = 'center';
                    ctx.font = '700 32px "Inter", sans-serif';
                    ctx.fillText(`${slot.label} (EMPTY)`, slot.x + STRIP_WIDTH / 2, slot.y + STRIP_HEIGHT / 2 - 10);
                    ctx.font = '400 22px "Inter", sans-serif';
                    ctx.fillText('2" × 3" Slot', slot.x + STRIP_WIDTH / 2, slot.y + STRIP_HEIGHT / 2 + 30);
                });

                if (completedStrips.length === 0) {
                    drawCuttingGuides(ctx);
                    paperResult.src = paperCanvas.toDataURL('image/jpeg', 0.95);
                    resolve();
                    return;
                }

                let loaded = 0;
                completedStrips.forEach((stripDataUrl, index) => {
                    const img = new Image();
                    img.onload = () => {
                        const slot = slots[index];
                        ctx.drawImage(img, slot.x, slot.y, STRIP_WIDTH, STRIP_HEIGHT);
                        loaded++;
                        if (loaded === completedStrips.length) {
                            drawCuttingGuides(ctx);
                            paperResult.src = paperCanvas.toDataURL('image/jpeg', 0.98);
                            resolve();
                        }
                    };
                    img.src = stripDataUrl;
                });
            });
        }

        function drawCuttingGuides(ctx) {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
            ctx.lineWidth = 2;

            ctx.beginPath();
            ctx.moveTo(STRIP_WIDTH, 0);
            ctx.lineTo(STRIP_WIDTH, PAPER_HEIGHT);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(0, STRIP_HEIGHT);
            ctx.lineTo(PAPER_WIDTH, STRIP_HEIGHT);
            ctx.stroke();
        }

        function download4x6Paper() {
            if (!paperResult.src) return;
            const link = document.createElement('a');
            link.download = `4x6-photo-paper-${completedStrips.length}strips-${Date.now()}.jpg`;
            link.href = paperResult.src;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function downloadLatestSingleStrip() {
            if (completedStrips.length === 0) return;
            const latestStrip = completedStrips[completedStrips.length - 1];
            const link = document.createElement('a');
            link.download = `single-2x3-strip-${completedStrips.length}-${Date.now()}.jpg`;
            link.href = latestStrip;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        window.onload = initCamera;
    </script>
